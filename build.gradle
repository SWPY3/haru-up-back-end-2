plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25'
    id 'org.jetbrains.kotlin.kapt' version '1.9.25'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'war'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'swyp'

java {
    toolchain {
//        languageVersion = JavaLanguageVersion.of(21)

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // JPA + Web + Security
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    kapt 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    kapt 'jakarta.annotation:jakarta.annotation-api'
    kapt 'jakarta.persistence:jakarta.persistence-api'
    testImplementation("org.springframework.security:spring-security-test")
    implementation 'org.springframework.boot:spring-boot-starter-validation' // ✅ @Valid, @Email 등 사용 시
    implementation 'org.springframework.boot:spring-boot-starter-aop' // AOP for rate limiting

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:0.11.5"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:0.11.5"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.11.5"

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor:1.7.3'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    kapt 'org.projectlombok:lombok:1.18.34'
    kaptTest 'org.projectlombok:lombok:1.18.34'

    // DB
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    // Hypersistence Utils (PostgreSQL 배열, JSON 등 지원)
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.13.3'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Loki (로그 수집)
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'

    // p6spy (SQL 로깅)
    implementation 'p6spy:p6spy:3.9.1'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus"

    // Mockito + Mockito-Kotlin
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // WAR deploy
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // 코드 변경 감지 (개발환경에서 사용할 목적)
    developmentOnly("org.springframework.boot:spring-boot-devtools")

    // Apache POI (엑셀 처리)
    implementation "org.apache.poi:poi-ooxml:5.2.5"

    // Firebase Admin SDK
    implementation "com.google.firebase:firebase-admin:9.2.0"
}

kotlin {
    compilerOptions {
        // Groovy DSL에서는 배열/리스트로 넘겨줘야 안전함
        freeCompilerArgs.addAll([
                '-Xjsr305=strict'
        ])
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

// Spring Boot 메인 클래스 지정 (bootRun 및 build용)
springBoot {
    mainClass = 'com.haruUp.HaruUpApplicationKt'
}

tasks.named('test') {
    // 실제 OpenAI API를 호출하는 큐레이션 평가는 일반 테스트에서 제외한다. (curationEval 태스크로 실행)
    useJUnitPlatform {
        excludeTags 'curation-eval'
    }
}

// 큐레이션 프롬프트 자동 평가 (실제 OpenAI API 호출 → build/curation-eval 리포트 생성)
//   ./gradlew curationEval
//   ./gradlew curationEval -Ppersonas=diet,toeic -Psessions=2
tasks.register('curationEval', Test) {
    group = 'verification'
    description = '큐레이션 챗봇 질문/미션 프롬프트를 실제 API로 실행하고 결과 리포트를 생성'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'curation-eval'
    }

    systemProperty 'curation.personas', findProperty('personas') ?: ''
    systemProperty 'curation.sessions', findProperty('sessions') ?: '1'
    if (System.getenv('OPENAI_API_KEY')) {
        environment 'OPENAI_API_KEY', System.getenv('OPENAI_API_KEY')
    }
    if (System.getenv('OPENAI_MODEL')) {
        environment 'OPENAI_MODEL', System.getenv('OPENAI_MODEL')
    }

    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat = 'full'
    }
}

// 관심사 임베딩 초기화 태스크
tasks.register('initEmbeddings', JavaExec) {
    group = 'application'
    description = '관심사 임베딩 초기화 실행'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.haruUp.domain.interest.InitEmbeddingsRunner'

    // JVM 설정
    jvmArgs = ['-Dspring.profiles.active=default']

    // 커맨드라인 인자 전달
    if (project.hasProperty('args')) {
        args project.property('args').toString().split('\\s+')
    }
}
