name: CI

# PR 과 main 푸시에서 컴파일 + 단위 테스트를 확인한다.
# DB·Redis·시크릿이 필요한 통합 테스트(@Tag("integration"))는 제외한다.
# 그 테스트들은 gitignore 된 env.properties 를 읽기 때문에 CI 에서 컨텍스트 자체가 뜨지 않는다.
on:
  pull_request:
  push:
    branches: [main]

# 워크플로에 필요한 최소 권한만 준다.
permissions:
  contents: read

# 같은 PR 에 연속 푸시하면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 컴파일 · 단위 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 컴파일
        run: ./gradlew compileKotlin compileTestKotlin

      - name: 단위 테스트
        run: ./gradlew unitTest

      - name: 테스트 리포트 업로드
        # 실패했을 때 원인을 보려면 리포트가 필요하다.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/unitTest/
          retention-days: 7
