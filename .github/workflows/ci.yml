name: CI

# PR 과 main 푸시에서 컴파일 + 단위 테스트 + 마이그레이션 검증을 확인한다.
# DB·Redis·시크릿이 필요한 통합 테스트(@Tag("integration"))는 아직 제외한다.
# 그 테스트들은 gitignore 된 env.properties 를 읽기 때문에 CI 에서 컨텍스트 자체가 뜨지 않는다.
on:
  pull_request:
  push:
    branches: [main]

# 워크플로에 필요한 최소 권한만 준다.
permissions:
  contents: read

# 같은 PR 에 연속 푸시하면 이전 실행을 취소한다.
# main 푸시는 취소하지 않는다. 그 커밋이 곧 배포 대상이라 검증 결과가 반드시 남아야 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 컴파일 · 단위 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 컴파일
        run: ./gradlew compileKotlin compileTestKotlin

      - name: 단위 테스트
        run: ./gradlew unitTest

      - name: 테스트 리포트 업로드
        # 실패했을 때 원인을 보려면 리포트가 필요하다.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/unitTest/
          retention-days: 7

  migration:
    name: 마이그레이션 검증
    runs-on: ubuntu-latest

    # 마이그레이션은 앱 기동 시 Flyway 가 실행하고 validate-on-migrate 로 검증한다.
    # 즉 SQL 이 잘못되면 배포가 아니라 "기동"이 실패한다. 머지 전에 실제 DB 에 적용해 본다.
    services:
      postgres:
        # 운영 스키마가 vector(1024) 컬럼을 쓰므로 pgvector 가 들어간 이미지가 필요하다.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haruup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haruup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: pgvector 확장 활성화
        run: psql -h localhost -U postgres -d haruup -c 'CREATE EXTENSION IF NOT EXISTS vector'
        env:
          PGPASSWORD: postgres

      - name: Flyway 마이그레이션 적용 검증
        # 빈 DB 전체 적용 / 기존 DB baseline 후 증분 / 재실행 무변화 3가지를 확인한다.
        run: ./gradlew flywayVerify
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: haruup
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: build/reports/tests/flywayVerify/
          retention-days: 7
